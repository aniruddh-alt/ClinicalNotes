model:
  model_name: "microsoft/Phi-3-mini-4k-instruct"
  model_max_length: 2048  # Reduced from 4096 to save memory
  torch_dtype_str: "bfloat16"
  attn_implementation: "flash_attention_2"  # Was defaulting to eager attention (OOM)
  trust_remote_code: true
  enable_liger_kernel: true

data:
  train:
    datasets:
      - dataset_name: "text_sft"
        dataset_path: "/workspace/summarization/MIMIC-IV-BHC/oncology-splits/train.jsonl"
    stream: false
  validation:
    datasets:
      - dataset_name: "text_sft"
        dataset_path: "/workspace/summarization/MIMIC-IV-BHC/oncology-splits/valid.jsonl"
    stream: false

training:
  output_dir: "/workspace/summarization/outputs/model-phi-mini"
  trainer_type: "TRL_SFT"
  use_peft: true
  enable_gradient_checkpointing: true  # Big VRAM savings
  gradient_checkpointing_kwargs:
    use_reentrant: false
  optimizer: "adamw_torch_fused"

  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 2e-4
  num_train_epochs: 1
  logging_steps: 10
  save_steps: 200
  save_final_model: true
  include_performance_metrics: true
  log_model_summary: false
  enable_wandb: false
  dataloader_num_workers: 4

peft:
  q_lora: true  # Quantized LoRA for lower memory usage
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_quant_storage: "bfloat16"
  bnb_4bit_compute_dtype: "bfloat16"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
