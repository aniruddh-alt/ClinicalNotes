# Summarization evaluation for fine-tuned Phi-3 Mini.
# Computes ROUGE-L, BLEU, and BERTScore (mirroring MIMIC-IV-BHC paper).
#
# Usage:
#   bash scripts/run_eval.sh phi

model:
  model_name: "/workspace/summarization/outputs/model-phi-mini-merged"
  model_max_length: 4096
  torch_dtype_str: "bfloat16"
  attn_implementation: "sdpa"
  load_pretrained_weights: true
  trust_remote_code: true

generation:
  max_new_tokens: 256
  batch_size: 4

tasks:
  - evaluation_backend: custom
    task_name: summarization_metrics
    num_samples: 100
    eval_kwargs:
      dataset_path: "/workspace/summarization/MIMIC-IV-BHC/oncology-splits/test.jsonl"

inference_engine: VLLM

output_dir: "/workspace/summarization/outputs/eval-phi-mini"
