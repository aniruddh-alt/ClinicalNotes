model:
  model_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  model_max_length: 2048  # Reduced for faster training
  torch_dtype_str: "bfloat16"
  attn_implementation: "flash_attention_2"  # Much faster than sdpa
  load_pretrained_weights: true
  trust_remote_code: true
  enable_liger_kernel: true  # 20-30% speedup
  chat_template: "llama3-instruct"

data:
  train:
    datasets:
      - dataset_name: "text_sft"
        dataset_path: "/workspace/summarization/MIMIC-IV-BHC/oncology-splits/train.jsonl"
    stream: false
  validation:
    datasets:
      - dataset_name: "text_sft"
        dataset_path: "/workspace/summarization/MIMIC-IV-BHC/oncology-splits/valid.jsonl"
    stream: false

training:
  output_dir: "/workspace/summarization/outputs/model-llama3_1-8b"
  trainer_type: "TRL_SFT"
  use_peft: true
  enable_gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  ddp_find_unused_parameters: false
  optimizer: "adamw_torch_fused"
  lr_scheduler_type: "cosine"
  warmup_steps: 100

  per_device_train_batch_size: 4  # Increased - A40 has plenty of VRAM
  gradient_accumulation_steps: 2  # Reduced to maintain effective batch 8
  learning_rate: 2e-4
  num_train_epochs: 1
  logging_steps: 10
  save_steps: 200
  log_model_summary: false
  include_performance_metrics: true
  enable_wandb: false
  dataloader_num_workers: 4  # Faster data loading

peft:
  q_lora: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_quant_storage: "bfloat16"
  bnb_4bit_compute_dtype: "bfloat16"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
