# ROUGE evaluation for fine-tuned Llama 3.1 8B.
#
# Requirements:
#   - pip install rouge-score
#   - The custom eval function must be imported before running. Use the
#     wrapper script: python scripts/run_eval.py llama
#
# Usage:
#   oumi evaluate -c configs/oumi/eval_llama3_1_8b.yaml

model:
  model_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  adapter_model: "/workspace/summarization/outputs/model-llama3_1-8b"
  model_max_length: 4096  # Must cover input length, some notes are 2500+ tokens
  torch_dtype_str: "bfloat16"
  attn_implementation: "flash_attention_2"
  trust_remote_code: true

generation:
  max_new_tokens: 256
  batch_size: 1

tasks:
  - evaluation_backend: custom
    task_name: rouge_summarization
    num_samples: 5  # Smoke test first, then increase
    eval_kwargs:
      dataset_path: "/workspace/summarization/MIMIC-IV-BHC/oncology-splits/test.jsonl"

inference_engine: NATIVE

output_dir: "/workspace/summarization/outputs/eval-llama3_1-8b"
