model:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  model_max_length: 2048  # Reduced from 16384 - was the #1 slowdown
  torch_dtype_str: "bfloat16"
  attn_implementation: "flash_attention_2"  # Much faster than sdpa, especially at long seqs
  load_pretrained_weights: true
  trust_remote_code: true
  enable_liger_kernel: true

data:
  train:
    datasets:
      - dataset_name: "text_sft"
        dataset_path: "/workspace/summarization/MIMIC-IV-BHC/oncology-splits/train.jsonl"
    stream: false
  validation:
    datasets:
      - dataset_name: "text_sft"
        dataset_path: "/workspace/summarization/MIMIC-IV-BHC/oncology-splits/valid.jsonl"
    stream: false

training:
  output_dir: "/workspace/summarization/outputs/model-qwen2_5-7b"
  trainer_type: "TRL_SFT"
  use_peft: true
  enable_gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  ddp_find_unused_parameters: false
  optimizer: "adamw_torch_fused"
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03

  per_device_train_batch_size: 4  # Increased - better GPU utilization
  gradient_accumulation_steps: 2  # Reduced to keep effective batch size = 8
  learning_rate: 2e-4
  num_train_epochs: 1
  logging_steps: 10
  save_steps: 200
  save_final_model: true
  include_performance_metrics: true
  log_model_summary: false
  enable_wandb: false
  dataloader_num_workers: 4  # Parallel data loading

peft:
  q_lora: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_quant_storage: "bfloat16"
  bnb_4bit_compute_dtype: "bfloat16"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
